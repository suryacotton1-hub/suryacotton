[build]
  functions = "netlify/functions"

# Redirect /api/* calls to Netlify Functions
[[redirects]]
  from = "/api/razorpay-key"
  to = "/.netlify/functions/razorpay-key"
  status = 200

[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200
