[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Security: Redirect common admin paths to index.html so unauthorized users cannot find admin
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/surya-admin-798"
  to = "/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/surya-admin-798.html"
  to = "/index.html"
  status = 302
  force = true

# Clean URLs without .html
[[redirects]]
